name: Docker image export

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/docker-export.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: Target NAS architecture
        type: choice
        options:
          - linux/amd64
          - linux/arm64
        default: linux/amd64
        required: true

jobs:
  export-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and export image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: ${{ inputs.platform || 'linux/amd64' }}
          tags: iplaza3d/ndsl-eshop-server:latest
          outputs: type=docker,dest=/tmp/ndsl-eshop-server.tar

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: ndsl-eshop-server-image
          path: /tmp/ndsl-eshop-server.tar
          if-no-files-found: error
          retention-days: 7