name: Docker publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug secrets presence (temporal, no expone valores)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then echo "::error::DOCKERHUB_USERNAME esta VACIO"; else echo "::notice::DOCKERHUB_USERNAME OK, largo=${#DOCKERHUB_USERNAME}"; fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then echo "::error::DOCKERHUB_TOKEN esta VACIO"; else echo "::notice::DOCKERHUB_TOKEN OK, largo=${#DOCKERHUB_TOKEN}"; fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: iplaza3d/ndsl-shop-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sync Docker Hub overview
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: iplaza3d/ndsl-shop-server
          short-description: "NDSL eShop - servidor de roms estilo Ownfoil/Tinfoil para Nintendo DS Lite"
          readme-filepath: ./docker/DOCKERHUB.md
